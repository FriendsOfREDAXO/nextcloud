package: nextcloud
version: '1.7.1'
author: FriendsOfREDAXO
supportpage: https://github.com/FriendsOfREDAXO/nextcloud

requires:
    redaxo: '^5.18.0'
    php:
        version: '>=8.1'

page:
    title: NextCloud
    perm: nextcloud[]
    icon: rex-icon fa-cloud
    subpages:
        main:
            title: 'translate:files'
        config:
            title: 'translate:settings'
            perm: admin[]

# Kein "permissions:"-Block hier -- REDAXO-Core kennt diesen YAML-Schluessel
# nicht (reine tote YAML, siehe Bugreport), das taeuschte frueher eine
# Registrierung nur vor. Feingranulare Rechte (nextcloud[upload_mediapool]/
# [delete]/[download]/[mediaplace_browse]) werden jetzt echt in boot.php per
# rex_perm::register() eingetragen, sonst tauchen sie in der
# Rollenverwaltung gar nicht erst auf. nextcloud[] (Basis-Zugriff) braucht
# das nicht -- das ist bereits der page-level "perm:" oben, wird von REDAXO
# automatisch registriert.
